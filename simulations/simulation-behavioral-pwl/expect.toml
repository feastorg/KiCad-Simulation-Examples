# V1 is PWL(0 0 1m 1 2m 1 3m 0): a ramp of 1 V/ms to 1 V at 1 ms, held to 2 ms, then
# down to 0 V at 3 ms. B1 is V=v(in)*v(in), B2 is V = v(in) > 0.5 ? 1 : 0.

# At 0.5 ms the ramp is at 0.5 V, so Sq = 0.5² = 0.25 V.
[[measure]]
name = "v_sq"
analysis = "tran"
meas = "find v(sq) at=0.5m"
expect = 0.25
rtol = 0.01

# Lim steps from 0 to 1 V when v(in) passes 0.5 V: 0.5 V / (1 V/ms) = 0.5 ms. The step
# is found to within one 1 µs time step.
[[measure]]
name = "t_lim"
analysis = "tran"
meas = "when v(lim)=0.5 rise=1"
expect = 0.5e-3
atol = 1e-6
