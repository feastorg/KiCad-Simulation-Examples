# L1 = 1 µH and C1 = 1 µF in series feed R1 = 10 Ω: f0 = 1/(2π√(LC)) = 159.2 kHz.
# The AC source has amplitude 1.

# At f0 the reactances cancel, so all of the 1 V reaches Out...
[[measure]]
name = "gain_f0"
analysis = "ac"
meas = "find vm(out) at=159.155k"
expect = 1.0
rtol = 0.01

# ...and the current is limited by R1 alone: 1 V / 10 Ω = 100 mA.
[[measure]]
name = "i_f0"
analysis = "ac"
meas = "find vm(r1#branch) at=159.155k"
expect = 0.1
rtol = 0.01

# Q = (1/R)·√(L/C) = 0.1, so the peak is broad. The −3 dB points are
# f0·(√(1 + 1/(4Q²)) ∓ 1/(2Q)) = 15.8 kHz and 1.61 MHz.
[[measure]]
name = "f_low"
analysis = "ac"
meas = "when vdb(out)=-3 cross=1"
expect = 15.76e3
rtol = 0.03

[[measure]]
name = "f_high"
analysis = "ac"
meas = "when vdb(out)=-3 cross=2"
expect = 1.607e6
rtol = 0.03
