# V1 = 12 V across R1 = 100 Ω and R2 = 100 Ω in series. An operating point has no
# sweep, so each entry's meas is an expression, read after the analysis.

# Equal resistors halve the voltage: 12 V × 100 / (100 + 100) = 6 V.
[[measure]]
name = "v_out"
analysis = "op"
meas = "v(out)"
expect = 6.0
rtol = 0.001

# The current through both resistors: 12 V / 200 Ω = 60 mA. Read at R2, whose
# positive direction (Out to ground) is the way the current flows; R1's reads −60 mA.
[[measure]]
name = "i_r2"
analysis = "op"
meas = "r2#branch"
expect = 0.06
rtol = 0.001
