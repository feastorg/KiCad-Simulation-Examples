# Rz1 = 470 Ω feeds the 5.6 V BZX84C5V6 zener, which sets Q1's base. Q1 is an emitter
# follower, so Out sits one Vbe below the zener: about 0.94 V for the default NPN at the
# load's 0.58 A, giving 5.6 − 0.94 ≈ 4.66 V. Averaged over 60-100 ms.
[[measure]]
name = "vout"
analysis = "tran"
meas = "avg v(out) from=60m to=100m"
expect = 4.66
rtol = 0.03

# Full-wave bridge: D1 and D2 conduct on alternate half-cycles, 10 ms apart at 50 Hz.
# Before #6 was fixed, both sources had phase=180 and the circuit rectified half-wave.
[[measure]]
name = "half_period"
analysis = "tran"
meas = "trig d1#branch val=0.2 rise=1 from=60m targ d2#branch val=0.2 rise=1 from=60m"
expect = 10e-3
rtol = 0.05
