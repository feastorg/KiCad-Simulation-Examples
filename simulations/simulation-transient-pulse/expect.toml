# R1 = 1 kΩ, C1 = 10 µF: τ = 10 ms. V1 is a 0 to 1 V square wave, high for 10 ms of
# every 20 ms, so each half period lasts exactly one τ.

# The first pulse charges C1 for one τ: 1 − 1/e = 0.632 V.
[[measure]]
name = "v_first"
analysis = "tran"
meas = "find v(out) at=10m"
expect = 0.632
rtol = 0.02

# Once settled, Out swings between 1/(1 + e) = 0.269 V and e/(1 + e) = 0.731 V.
[[measure]]
name = "v_max"
analysis = "tran"
meas = "max v(out) from=60m to=100m"
expect = 0.731
rtol = 0.02

[[measure]]
name = "v_min"
analysis = "tran"
meas = "min v(out) from=60m to=100m"
expect = 0.269
rtol = 0.03
