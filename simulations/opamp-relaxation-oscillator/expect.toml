# R1 = R2 = 10 kΩ feed back β = R2 / (R1 + R2) = 0.5 of Out, and R3 = 10 kΩ charges
# C1 = 47 nF towards whichever rail Out is on, so the period is
# T = 2 · R3 · C1 · ln((1 + β) / (1 − β)) = 2 · 470 µs · ln 3 = 1.0327 ms (968.3 Hz).
# The model's 400 kHz gain-bandwidth makes Out switch late, so the simulated period is
# 1.3 % longer: with POLE=2000 it lands on 1.0329 ms.
# The period is read over one cycle after 5 ms; the start, kicked by .ic, is over by then.
# With the max step pinned at 0.1 µs, 56 runs (Gear or trapezoidal, reltol 1e-3 or 1e-4,
# with or without uic, time step 0.1 to 10 µs) all give 1.0457 to 1.0458 ms and
# 15.11 V. A 1 µs max step gives 1.0412 ms and 15.056 V. R3 or C1 off by 5 % moves the
# period by 5 %; R1 or R2 off by 5 % moves the period by 2.9 to 3.1 % and the swing by 2.4 to 2.5 %.
[[measure]]
name = "period"
analysis = "tran"
meas = "trig v(/cap) val=0 rise=1 td=5m targ v(/cap) val=0 rise=2 td=5m"
expect = 1.0457e-3
rtol = 0.01

# C1 swings between the thresholds, ±β · Vsat = ±0.5 · 14.990 V = ±7.495 V, 14.99 V peak
# to peak. It keeps charging while Out switches, and peaks at +7.544 V and −7.564 V.
[[measure]]
name = "cap_pp"
analysis = "tran"
meas = "pp v(/cap) from=5m to=10m"
expect = 15.11
rtol = 0.01
