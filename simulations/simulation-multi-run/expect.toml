# R1 = 1 kΩ, C1 = 100 µF, and V1 steps from 0 to 1 V at t = 0. V(Out) reaches
# 1 − 1/e = 0.632 V after one time constant, so t63 = R1 · C1.
# A Multi Run tuner on R1 from 1k to 4k in 4 steps sends "alter @R1=<value>" before
# each run; the measures with an alter repeat what it sends.

# t63 = 1 kΩ · 100 µF = 0.1 s
[[measure]]
name = "t63_1k"
analysis = "tran"
meas = "when v(out)=0.6321206 rise=1"
expect = 0.1
rtol = 0.01

# t63 = 2 kΩ · 100 µF = 0.2 s
[[measure]]
name = "t63_2k"
analysis = "tran"
alter = "@R1=2000"
meas = "when v(out)=0.6321206 rise=1"
expect = 0.2
rtol = 0.01

# t63 = 3 kΩ · 100 µF = 0.3 s
[[measure]]
name = "t63_3k"
analysis = "tran"
alter = "@R1=3000"
meas = "when v(out)=0.6321206 rise=1"
expect = 0.3
rtol = 0.01

# t63 = 4 kΩ · 100 µF = 0.4 s
[[measure]]
name = "t63_4k"
analysis = "tran"
alter = "@R1=4000"
meas = "when v(out)=0.6321206 rise=1"
expect = 0.4
rtol = 0.01
