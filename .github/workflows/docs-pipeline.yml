name: Docs Pipeline

on:
  push:
    branches: [main]
    paths:
      - "simulations/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  # Pull requests build the site, so a broken render or page shows up before merge;
  # only main deploys it.
  pull_request:
    paths:
      - "simulations/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch: a pull request's build never cancels a deploy from main.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:1.9.1-1_k10.0.4_d13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ngspice librsvg2-bin python3-pil

      - name: Render schematics
        run: bash scripts/build_docs.sh

      - name: Upload generated docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-docs
          path: docs

  build:
    needs: [generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-docs
          path: _generated_docs

      - name: Sync generated docs
        run: |
          rsync -a --delete _generated_docs/ docs/

      - name: Install Python deps
        run: pip install pyyaml

      - name: Inject FEAST theme assets
        run: python3 scripts/inject_feast_assets.py

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  # Deploying in its own job, after the upload job has finished, is the layout of
  # GitHub's Pages workflows. In one job, deploy-pages twice found no "github-pages"
  # artifact right after it was uploaded (runs 45684316371 and 45687575786).
  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
